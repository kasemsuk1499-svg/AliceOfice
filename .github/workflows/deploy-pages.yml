name: Validate Alice Office
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/core.js
          node --check src/app.js
          node --check src/cloud.js
          node --check src/cloud-config.js
      - name: Verify website files
        run: |
          test -s index.html
          test -s src/core.js
          test -s src/app.js
          test -s src/cloud.js
          test -s src/cloud-config.js
          test -s README.md
